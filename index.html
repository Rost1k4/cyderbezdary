<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font:14px system-ui,sans-serif;color:#eee;background:transparent}.drop{border:2px dashed #7566c5;border-radius:12px;padding:18px;text-align:center;background:rgba(139,108,255,.08);outline:none;cursor:text}.drop:focus{border-color:#b5a6ff;background:rgba(139,108,255,.16)}.hint{opacity:.8;font-size:12px;margin-top:6px}img{max-width:100%;max-height:160px;margin-top:10px;border-radius:8px}button{margin-top:8px;padding:6px 10px;border:1px solid #7566c5;border-radius:7px;background:#241e5a;color:#fff;cursor:pointer}
</style></head><body><div class="drop" id="drop" tabindex="0" role="textbox" aria-label="Поле для вставлення скріншота">Клацни сюди та натисни <b>Ctrl+V</b>, щоб вставити скріншот<div class="hint">Або вибери файл кнопкою нижче. Можна додати кілька зображень.</div><input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><button id="choose" type="button">Обрати фото</button><div id="preview"></div><button id="clear" type="button" hidden>Очистити вставлені фото</button></div>
<script>
(function(){const drop=document.getElementById('drop'),file=document.getElementById('file'),preview=document.getElementById('preview'),choose=document.getElementById('choose'),clear=document.getElementById('clear');let images=[];function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:images.map(x=>({name:x.name,mime:x.mime,data:x.data})),dataType:'json'},'*');parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.min(310,150+images.length*30)},'*');}function add(f){if(!f||!f.type||!['image/png','image/jpeg','image/webp'].includes(f.type))return;const reader=new FileReader();reader.onload=()=>{const data=String(reader.result).split(',')[1];if(!data)return;images.push({name:f.name||('clipboard-'+(images.length+1)+'.png'),mime:f.type,data});const im=document.createElement('img');im.src=reader.result;im.alt=f.name||'Вставлений скріншот';preview.appendChild(im);clear.hidden=false;send();};reader.readAsDataURL(f);}drop.addEventListener('click',e=>{if(e.target!==choose&&e.target!==clear)drop.focus()});drop.addEventListener('paste',e=>{const items=e.clipboardData&&e.clipboardData.items;if(!items)return;let found=false;for(const item of items){if(item.type&&item.type.startsWith('image/')){const f=item.getAsFile();if(f){add(f);found=true;}}}if(found)e.preventDefault();});choose.addEventListener('click',e=>{e.stopPropagation();file.click()});file.addEventListener('change',()=>{for(const f of file.files)add(f);file.value='';});clear.addEventListener('click',e=>{e.stopPropagation();images=[];preview.innerHTML='';clear.hidden=true;send();});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:150},'*');})();
</script></body></html>
